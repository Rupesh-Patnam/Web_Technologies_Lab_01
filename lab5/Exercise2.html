<!DOCTYPE html>
<html>
<head>
<title>Library Tracker (XML)</title>
<style>
table, th, td { border:1px solid black; border-collapse: collapse; padding:5px; }
</style>
</head>
<body>

<h2>Library Book Tracker</h2>

<form id="bookForm">
ID: <input type="text" id="bid" required>
Title: <input type="text" id="btitle" required>
Author: <input type="text" id="bauthor" required>
Status:
<select id="bstatus">
<option>Available</option>
<option>Not Available</option>
</select>
<button type="submit">Add Book</button>
</form>

<table>
<thead>
<tr><th>ID</th><th>Title</th><th>Author</th><th>Status</th><th>Action</th></tr>
</thead>
<tbody id="bookTable"></tbody>
</table>

<script id="booksXML" type="text/xml">
<books>
    <book>
        <id>101</id>
        <title>Java Programming</title>
        <author>James</author>
        <status>Available</status>
    </book>
</books>
</script>

<script>
let parser2 = new DOMParser();
let xmlBooks = parser2.parseFromString(
    document.getElementById("booksXML").textContent,
    "text/xml"
);

displayBooks();

function displayBooks(){
    const table = document.getElementById("bookTable");
    table.innerHTML = "";
    const books = xmlBooks.getElementsByTagName("book");

    for(let i=0;i<books.length;i++){
        let b = books[i];
        table.innerHTML += `
        <tr>
        <td>${b.getElementsByTagName("id")[0].textContent}</td>
        <td>${b.getElementsByTagName("title")[0].textContent}</td>
        <td>${b.getElementsByTagName("author")[0].textContent}</td>
        <td>${b.getElementsByTagName("status")[0].textContent}</td>
        <td>
        <button onclick="deleteBook(${i})">Delete</button>
        </td>
        </tr>`;
    }
}

document.getElementById("bookForm").addEventListener("submit", function(e){
    e.preventDefault();

    const book = xmlBooks.createElement("book");
    book.innerHTML = `
        <id>${bid.value}</id>
        <title>${btitle.value}</title>
        <author>${bauthor.value}</author>
        <status>${bstatus.value}</status>
    `;

    xmlBooks.documentElement.appendChild(book);
    displayBooks();
    this.reset();
});

function deleteBook(index){
    xmlBooks.getElementsByTagName("book")[index].remove();
    displayBooks();
}
</script>

</body>
</html>
