<!DOCTYPE html>
<html>
<head>
<title>Employee Management (XML)</title>
<style>
table, th, td { border:1px solid black; border-collapse: collapse; padding:5px; }
.msg { font-weight:bold; margin:5px 0; }
</style>
</head>
<body>

<h2>Employee Management System</h2>

<form id="empForm">
ID: <input type="text" id="eid" required>
Name: <input type="text" id="ename" required>
Dept: <input type="text" id="edept" required>
Salary: <input type="number" id="esalary" required>
<button type="submit">Add Employee</button>
</form>

<div class="msg" id="message"></div>

<table>
<thead>
<tr><th>ID</th><th>Name</th><th>Dept</th><th>Salary</th><th>Action</th></tr>
</thead>
<tbody id="empTable"></tbody>
</table>

<!-- Local XML -->
<script id="employeesXML" type="text/xml">
<employees>
    <employee>
        <id>1</id>
        <name>Rupesh</name>
        <department>IT</department>
        <salary>50000</salary>
    </employee>
    <employee>
        <id>2</id>
        <name>John</name>
        <department>HR</department>
        <salary>40000</salary>
    </employee>
</employees>
</script>

<script>
let parser = new DOMParser();
let xmlDoc;

try {
    xmlDoc = parser.parseFromString(
        document.getElementById("employeesXML").textContent,
        "text/xml"
    );
    displayEmployees();
} catch {
    showMsg("Malformed XML!", true);
}

function displayEmployees(){
    const table = document.getElementById("empTable");
    table.innerHTML = "";
    const employees = xmlDoc.getElementsByTagName("employee");

    if(employees.length === 0){
        showMsg("No employees found!", true);
    }

    for(let i=0; i<employees.length; i++){
        let emp = employees[i];
        table.innerHTML += `
        <tr>
        <td>${emp.getElementsByTagName("id")[0].textContent}</td>
        <td>${emp.getElementsByTagName("name")[0].textContent}</td>
        <td>${emp.getElementsByTagName("department")[0].textContent}</td>
        <td>${emp.getElementsByTagName("salary")[0].textContent}</td>
        <td>
            <button onclick="deleteEmployee(${i})">Delete</button>
            <button onclick="updateEmployee(${i})">Update</button>
        </td>
        </tr>`;
    }
}

document.getElementById("empForm").addEventListener("submit", function(e){
    e.preventDefault();

    const emp = xmlDoc.createElement("employee");

    emp.innerHTML = `
        <id>${eid.value}</id>
        <name>${ename.value}</name>
        <department>${edept.value}</department>
        <salary>${esalary.value}</salary>
    `;

    xmlDoc.documentElement.appendChild(emp);
    displayEmployees();
    this.reset();
    showMsg("Employee Added Successfully");
});

function deleteEmployee(index){
    const emp = xmlDoc.getElementsByTagName("employee")[index];
    emp.parentNode.removeChild(emp);
    displayEmployees();
    showMsg("Employee Deleted");
}

function updateEmployee(index){
    const emp = xmlDoc.getElementsByTagName("employee")[index];
    let newSalary = prompt("Enter new salary:");
    if(newSalary){
        emp.getElementsByTagName("salary")[0].textContent = newSalary;
        displayEmployees();
        showMsg("Salary Updated");
    }
}

function showMsg(msg, error=false){
    const m = document.getElementById("message");
    m.textContent = msg;
    m.style.color = error ? "red" : "green";
}
</script>

</body>
</html>
