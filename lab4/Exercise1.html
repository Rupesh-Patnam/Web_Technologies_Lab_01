<!DOCTYPE html>
<html>
<head>
<title>Username Checker</title>
<style>
body { font-family: Arial; }
#status { font-weight: bold; margin-top:5px; }
.loader { display:none; color:blue; }
.error { color:red; }
.success { color:green; }
</style>
</head>
<body>

<h2>Registration Form</h2>

<form id="regForm">
Username:
<input type="text" id="username" required>
<div class="loader" id="loading">Checking...</div>
<div id="status"></div>
<br><br>
<button type="submit">Register</button>
</form>

<!-- JSON DATA INSIDE HTML -->
<script type="application/json" id="usersData">
{
  "users": ["rupesh", "admin", "john123", "student01"]
}
</script>

<script>
let isAvailable = false;

const usersJSON = JSON.parse(
    document.getElementById("usersData").textContent
);

document.getElementById("username").addEventListener("input", function(){

    const username = this.value.trim();
    if(username === "") return;

    document.getElementById("loading").style.display = "block";

    setTimeout(() => {   // Simulate AJAX delay

        document.getElementById("loading").style.display = "none";

        if(usersJSON.users.includes(username)){
            document.getElementById("status").textContent = "Username already taken";
            document.getElementById("status").className = "error";
            isAvailable = false;
        } else {
            document.getElementById("status").textContent = "Username available";
            document.getElementById("status").className = "success";
            isAvailable = true;
        }

    }, 500);

});

document.getElementById("regForm").addEventListener("submit", function(e){
    if(!isAvailable){
        e.preventDefault();
        alert("Username not available!");
    }
});
</script>

</body>
</html>
